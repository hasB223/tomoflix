services:
  server:
    build:
      context: ./server
    ports:
      - "8080:8080"
    environment:
      - TOMOFLIX_PORT=8080
      - TOMOFLIX_VIDEO_DIR=/app/videos
    volumes:
      # Point this at wherever your .mp4 files actually live on the host.
      - ./videos:/app/videos
    restart: unless-stopped
