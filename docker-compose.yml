services:
  server:
    build:
      context: ./server
    ports:
      - "8080:8080"
    environment:
      - TOMOFLIX_PORT=8080
      - TOMOFLIX_MEDIA_DIR=/app/videos
    volumes:
      # Point this at wherever your media files (video or audio) actually
      # live on the host.
      - ./videos:/app/videos
    restart: unless-stopped
